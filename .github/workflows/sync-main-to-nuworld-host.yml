# Keeps nuworld-host (main plus the NuWorld host seams, docs/pipeline.md
# "The nuworld-host branch") following main: every push to main opens or
# reuses one PR main -> nuworld-host and enables auto-merge with a merge
# commit. GitHub merges it only after nuworld-host's required checks pass on
# the PR and there is no conflict; a conflict or a failed check leaves the PR
# open for a human. Nothing here pushes a branch or merges directly.
#
# The token comes from a GitHub App (secrets NUWORLD_SYNC_APP_CLIENT_ID,
# NUWORLD_SYNC_APP_PRIVATE_KEY) or, as a fallback, a fine-grained PAT
# (NUWORLD_SYNC_TOKEN). GITHUB_TOKEN cannot be used: a PR it opens starts no
# pull_request workflows, so the required checks would never report.

name: sync-main-to-nuworld-host

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-main-to-nuworld-host
  cancel-in-progress: false

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Pick the credential
        id: auth
        env:
          APP_CLIENT_ID: ${{ secrets.NUWORLD_SYNC_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.NUWORLD_SYNC_APP_PRIVATE_KEY }}
          PAT: ${{ secrets.NUWORLD_SYNC_TOKEN }}
        run: |
          if [ -n "$APP_CLIENT_ID" ] && [ -n "$APP_PRIVATE_KEY" ]; then
            echo "mode=app" >> "$GITHUB_OUTPUT"
          elif [ -n "$PAT" ]; then
            echo "mode=pat" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Set NUWORLD_SYNC_APP_CLIENT_ID + NUWORLD_SYNC_APP_PRIVATE_KEY (or NUWORLD_SYNC_TOKEN); see docs/pipeline.md"
            exit 1
          fi

      - name: GitHub App token
        id: app
        if: steps.auth.outputs.mode == 'app'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.NUWORLD_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.NUWORLD_SYNC_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          # Merging a sync PR that changes .github/workflows needs it.
          permission-workflows: write

      - name: Open or reuse the sync PR and enable auto-merge
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.NUWORLD_SYNC_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BASE: nuworld-host
          REQUIRED: matching validate
        run: |
          set -euo pipefail
          if ! branch=$(gh api "repos/$GH_REPO/branches/$BASE"); then
            echo "::error::$BASE does not exist"
            exit 1
          fi
          # Fail closed: without the required checks auto-merge would merge at once.
          contexts=$(jq -r '.protection.required_status_checks.contexts // [] | .[]' <<< "$branch")
          for c in $REQUIRED; do
            if ! grep -qx "$c" <<< "$contexts"; then
              echo "::error::$BASE does not require the '$c' check; not enabling auto-merge"
              exit 1
            fi
          done

          ahead=$(gh api "repos/$GH_REPO/compare/$BASE...main" --jq .ahead_by)
          if [ "$ahead" = 0 ]; then
            echo "$BASE already contains main"
            exit 0
          fi

          pr=$(gh pr list --base "$BASE" --head main --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            url=$(gh pr create --base "$BASE" --head main --title "sync main into $BASE" \
              --body "Merges main into $BASE. Auto-merge waits for the required checks; a conflict is resolved by hand.")
            pr=${url##*/}
            echo "opened #$pr ($ahead commits)"
          else
            echo "reusing #$pr ($ahead commits)"
          fi
          gh pr merge "$pr" --auto --merge
