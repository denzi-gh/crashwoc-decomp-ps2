# Byte-gated verification on GitHub-hosted runners, dtk-template style
# (docs/pipeline.md, "CI" section). The job runs inside a PRIVATE container image from the
# crashwoc-decomp-ps2-build repository: the public toolchain image with the
# retail game files baked in at /orig. Pulling it needs only GITHUB_TOKEN,
# authorized by the package's "Manage Actions access" Read grant for this
# repository.
#
# Nothing game-derived leaves a run and the pipeline never writes back to the
# repo: the only output is the sanitized report artifact (whitelist-filtered
# by tools/sanitize_report.py). Progress history for a site comes from the
# accumulated report artifacts (e.g. decomp.dev), not a committed baseline.

name: matching

on:
  push:
    branches: ["**"]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# Serialize per ref. A new push to a feature branch supersedes its in-flight
# run; `main` is never cancelled mid-flight so its published report always
# finishes.
concurrency:
  group: matching-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read # checkout only; the pipeline never writes back to the repo
  packages: read # pull the private build image

jobs:
  matching:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/denzi-gh/crashwoc-decomp-ps2-build:main
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Git config
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Copy game files from the image
        run: cp -a /orig .

      - name: Cache locked toolchain
        uses: actions/cache@v4
        with:
          path: |
            tools/download
            compiler
          key: toolchain-${{ hashFiles('toolchain.lock.json') }}

      - name: Cache build tree
        uses: actions/cache@v4
        with:
          path: |
            build
            expected
            .ninja_deps
            .ninja_log
          key: build-${{ github.sha }}
          restore-keys: build-

      - name: Install and fingerprint the locked toolchain
        # --all verifies every lock component with an install_dir: both
        # matching compilers (ee-gcc-tt, ee-gcc), the PE runner wibo,
        # ps2-binutils and objdiff. A new fingerprinted component enrolls
        # itself; nothing can be forgotten here.
        run: |
          python tools/setup_toolchain.py --download
          python tools/fingerprint_compiler.py --all

      - name: Verify target binary
        run: python tools/verify_target.py

      - name: Committed registries are exactly reproducible
        run: |
          python tools/extract_mdebug.py --check
          python tools/extract_data_map.py --check
          python tools/status.py --check

      - name: Configure (split, build graph, objdiff config)
        # --strict makes any splat/backend version drift against the lock
        # fatal. The nightly additionally runs the deterministic double
        # split (--check); push/PR runs split once to stay fast.
        if: github.event_name != 'schedule'
        run: python configure.py --strict

      - name: Configure with determinism check (nightly)
        if: github.event_name == 'schedule'
        run: python configure.py --strict --check

      - name: Build all object sets
        run: ninja expected current matching

      - name: Byte gates -- image identity and every promoted function
        run: ninja verify-loaded verify-promoted

      - name: Generate and sanitize the report
        run: ninja report report-public

      - name: Report honors every verified matching function
        # The public report must show 100% for every function verify_promoted
        # confirmed as byte-matching. Runs before the artifact is staged.
        run: python tools/check_report_matches.py

      - name: Stage the publishable artifact
        # Only the whitelist-filtered report is staged, under the filename
        # decomp.dev expects inside the artifact.
        run: |
          rm -rf build/publish
          mkdir -p build/publish
          cp build/pal103/report.public.json build/publish/report.json

      - name: Smoke-test the staged artifact
        # Final gate on the exact bytes that will be uploaded: valid JSON, a
        # strict schema subset, no orig/absolute-path/blob leak, no hollow
        # "100% of nothing" measure, and every verified matching function at
        # 100%. Fails the run before anything leaves the container.
        run: python tools/smoke_report.py

      - name: Upload decomp.dev report artifact
        uses: actions/upload-artifact@v4
        with:
          name: SLES_503.86_report
          path: build/publish/report.json
          if-no-files-found: error
