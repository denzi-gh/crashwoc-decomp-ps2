# Compiler / assembler knowledge registry for pal103 matching.
#
# Only *supported*, established behavior belongs here -- each quirk names the
# profiles it applies to, the observable signature, its effect, how the
# pipeline already handles it (or that it is an architectural blocker), a
# confidence, and evidence pointers into the tree. The domain layer
# (tools/decomp_agent) surfaces these to an AI agent as context; a heuristic or
# speculative note must NOT be recorded as `proven`.
#
# Confidence: proven | likely | hypothesis
#
# Regenerate/extend by hand with evidence; this is committed configuration,
# read by tools/decomp_agent/compiler_knowledge.py.

schema = 1

[[quirk]]
id = "default.move-pseudo-encoding"
profiles = ["default", "sce"]
category = "assembler_normalization"
signature = "compiler assembly contains a `move $x,$y` pseudo-instruction"
effect = "the decompals `as` encodes `move` as `or $x,$y,$0`; Sony/retail use `daddu $x,$y,$0`"
handling = "normalized by tools/gen_hybrid.py::_sonyize before assembly"
confidence = "proven"
evidence = ["tools/gen_hybrid.py::_sonyize"]

[[quirk]]
id = "default.break-operand-encoding"
profiles = ["default", "sce"]
category = "assembler_normalization"
signature = "compiler assembly contains a one-operand `break N`"
effect = "the two assemblers place the code field in different bit ranges; retail uses `break 0,N`"
handling = "rewritten to the explicit `break 0,N` form by tools/gen_hybrid.py::_sonyize"
confidence = "proven"
evidence = ["tools/gen_hybrid.py::_sonyize"]

[[quirk]]
id = "default.r5900-short-loop-padding"
profiles = ["default"]
category = "loop_shape"
signature = "a short (<= 3-instruction) backward branch loop"
effect = "Sony's `as` pads short loops with nops for the R5900 erratum; the SN ProDG build and retail game code do not -- padded output can never byte-match"
handling = "the matching build assembles hybrids with the decompals `as` (no padding), not Sony's `as`"
confidence = "proven"
evidence = ["tools/gen_hybrid.py::_assemble_hybrid", "config/pal103/profiles.toml"]

[[quirk]]
id = "sce.sq-lq-callee-saves"
profiles = ["sce"]
category = "saved_registers"
signature = "callee-saved GPRs stored/loaded in the prologue/epilogue"
effect = "the Sony 2.9 build uses 128-bit sq/lq for callee saves; the SN ProDG (default) build uses sd/ld -- a unit built by the wrong compiler cannot match"
handling = "profile selection: game/engine TUs use `default`, the Sony runtime uses `sce` (never mix)"
confidence = "proven"
evidence = ["config/pal103/profiles.toml"]

[[quirk]]
id = "default.lit4-inline-vs-pool"
profiles = ["default", "sce"]
category = "literal_pool"
signature = "`li.s $fN,<constant>` in the compiler output"
effect = "a float whose 32-bit image has a zero low half is materialized inline (lui+mtc1, no data); any other float goes to a .lit4 pool slot -- data the hybrid must not own"
handling = "pool-bound li.s is rewritten to load the retail .lit4 slot by symbol (tools/gen_hybrid.py::_rewrite_lis / Lit4Mapper)"
confidence = "proven"
evidence = ["tools/gen_hybrid.py::_rewrite_lis", "tools/gen_hybrid.py::Lit4Mapper"]

[[quirk]]
id = "default.lit8-double-pool"
profiles = ["default", "sce"]
category = "literal_pool"
signature = "`li.d $fN,<constant>` (double literal) in the compiler output"
effect = "a double whose float64 image has a nonzero low word needs a .lit8 pool entry; a zero-low-word double stays inline (lui+mtc1 pair)"
handling = "SUPPORTED: pool-bound li.d is rewritten to load the retail .lit8 slot by symbol, mapped by value (tools/gen_hybrid.py::_rewrite_lis / Lit4Mapper.map_for_slice8). A `li.d`/`li.s` into a GPR (not $fN) is a raw bit pattern passed to a soft-double helper -- rewritten to `dli $reg,0x<bits>`; the `dli` macro is best-effort and blocks loudly if the decompals-as expansion diverges from retail's SN sequence"
confidence = "proven"
evidence = ["tools/gen_hybrid.py::_rewrite_lis", "tools/gen_hybrid.py::Lit4Mapper.map_for_slice8", "tests/test_fp_pool.py"]

[[quirk]]
id = "default.jump-table-rodata"
profiles = ["default", "sce"]
category = "jump_table_rodata"
signature = "a dense switch compiled to an indexed jump through a .rodata table (`$Ln: .word $Lm ...`, dispatched `j $reg`)"
effect = "the compiler emits the table as .rodata relocations (absolute, like retail's auto-named `jtbl_<vram>`), which the hybrid may not own as bytes"
handling = "SUPPORTED by borrow-by-STRUCTURE: the compiled table is detected as a _JumpTable(count) marker and repointed onto the function's own retail jtbl_/jpt_ slot (tools/gen_hybrid.py::map_jump_tables), and `_sonyize` rewrites `j $reg`->`jr $reg`. Requires the C switch to produce the SAME table entry count/order (positional borrow; multiple tables per function OK); a count mismatch fails loudly. A function whose C cannot reproduce the table shape (e.g. MoveCreature's ~15KB multi-table dispatch) stays a blocker."
confidence = "likely"
evidence = ["tools/gen_hybrid.py::map_jump_tables", "src/game/creature.c::MovePlayer"]

[[quirk]]
id = "default.initialized-local-sdata"
profiles = ["default", "sce"]
category = "initialized_local_sdata"
signature = "an initialized local aggregate or string (e.g. `short t[2]={0,1}`, a `$LCn` .sdata/.rodata block) in a function"
effect = "the compiler places the initializer in .sdata/.rodata; the hybrid may not own data sections"
handling = "SUPPORTED: _extract_local_data pulls the aggregate out and map_owned_data borrows the unit-owned retail data symbol holding those exact bytes (by named twin, or by unique address in the unit's data_map ranges, at natural alignment), rewriting %hi/%lo($LCn) onto it -- no data emitted, hybrid stays .text-only. Strings handled the same way. Unblocked DrawCharacterModel. Ambiguous bytes (>1 address) still fail loudly."
confidence = "proven"
evidence = ["tools/gen_hybrid.py::map_owned_data", "tools/gen_hybrid.py::_extract_local_data"]

[[quirk]]
id = "default.duplicate-static-names"
profiles = ["default", "sce"]
category = "assembler_normalization"
signature = "a static function name shared by two translation units"
effect = "four statics (ReadNuIFFGeomSkin, ReadNuIFFGeomVtx, NuNodeRead, _fpadd_parts) collide across TUs"
handling = "disambiguated as NAME__<vram>; always address such functions by canonical id"
confidence = "proven"
evidence = ["tools/declib/asmtext.py::disambiguate"]

[[quirk]]
id = "default.function-extent-padding"
profiles = ["default", "sce"]
category = "size_difference"
signature = "a function shorter than its registry extent (gap to the next function)"
effect = "retail pads a function's tail to the next function with nop; the compiler does not emit that pad"
handling = "the hybrid zero-fills (nop) to the extent end via `.org`; exact matching is verified over the FULL extent"
confidence = "proven"
evidence = ["tools/gen_hybrid.py::_splice_unit", "tools/verify_promoted.py"]

[[quirk]]
id = "default.decompals-assembler-in-hybrids"
profiles = ["default", "sce"]
category = "assembler_normalization"
signature = "hybrid assembly containing retail slices and %gp_rel(sym) relocations"
effect = "Sony's `as` predates %gp_rel syntax and adds R5900 loop padding; retail slices only round-trip through the decompals `as`"
handling = "hybrids are assembled with declib.toolchain.AS (decompals as), never the ee-gcc driver"
confidence = "proven"
evidence = ["tools/gen_hybrid.py::_assemble_hybrid"]

[[quirk]]
id = "default.small-mapped-switch-shape"
profiles = ["default"]
category = "codegen_shape"
signature = "a small switch/if mapping a few non-contiguous integer cases to constants (e.g. object 1/2/3 -> 0x85/0x86/0x87, else -1)"
effect = "a C `switch` compiles to a binary-search comparison tree (slti + extra li/b), which is larger and reorders the compares; retail SN ee-gcc 2.95.2 emitted a linear if / else-if chain whose final case is a ternary lowered with `movz` (e.g. `xori t,obj,3; li a,-1; li v,0x87; movz a,v,t`)"
handling = "MATCHING HINT, not pipeline-handled: write the C as `if (x==A) o=..; else if (x==B) o=..; else o = (x==C) ? .. : ..;` so the last case becomes the movz, matching size and compare order. Verified on DrawPanel3DObject (game/panel)."
confidence = "likely"
evidence = ["src/game/panel.c::DrawPanel3DObject", "config/pal103/status/game/panel.toml"]

[[quirk]]
id = "default.repeated-array-element-index"
profiles = ["default", "sce"]
category = "codegen_shape"
signature = "two or more field accesses to the same array element written as arr[i].a, arr[i].b"
effect = "-O2 does not always CSE the element address across separate arr[i] expressions and recomputes base+i*stride each time (one extra sll/addu per repeat), inflating the function past its extent (`.org backwards`)"
handling = "MATCHING HINT: bind a pointer once (`T *e = &arr[i];` then `e->a`, `e->b`) so the address is computed a single time. Verified on DrawPanel3DObject's ObjTab[o].scene/.special."
confidence = "likely"
evidence = ["src/game/panel.c::DrawPanel3DObject"]

[[quirk]]
id = "default.fp-hazard-nop"
profiles = ["default"]
category = "assembler_hazard"
signature = "an `mtc1` feeding a nearby FP op/store: `mtc1 -> swc1`, `mtc1 -> c.lt.s`/`c.le.s`, or `mtc1 -> cvt.s.w`"
effect = "retail's SN ProDG `as` materializes a real hazard nop between the mtc1 and the dependent instruction. ee-gcc emits these as commented `#nop` and defers to the assembler; the decompals `as` only re-inserts the `mtc1 -> cvt.s.w` nop and DROPS the `mtc1 -> {swc1, c.le.s}` ones. Each dropped nop shifts the whole tail, so an otherwise byte-exact function reads low fuzzy (register allocation and logic identical)."
handling = "NOT yet pipeline-handled -- record a blocker and keep the faithful C at state=asm (candidate for `equivalent`). Tooling fix: teach the decompals `as`/gen_hybrid to emit the `mtc1 -> {swc1, c.le.s}` hazard nop as it already does for `mtc1 -> cvt.s.w`; one fix unblocks all functions in this class."
confidence = "proven"
evidence = ["src/game/main.c::SetLevel", "src/game/credits.c::DrawCredits", "src/game/creature.c::ModelAnimDuration", "config/pal103/status/game/main.toml"]

[[quirk]]
id = "default.goto-loop-alignment"
profiles = ["default"]
category = "loop_shape"
signature = "a retail inner-loop head at a NON-8-aligned address with no preceding pad"
effect = "SN ee-gcc 2.95.2 at -O2 emits `.align 3` (8-byte) loop-head alignment ONLY for explicit loop constructs (which carry a NOTE_INSN_LOOP_BEG) and also lets LICM hoist small `li` constants out of them. A `for`/`while` therefore adds a pad nop + hoisted constants and overruns the extent (`.org backwards`)."
handling = "MATCHING HINT: when the loop head is not 8-aligned, write the loop with `goto` (label + conditional `goto`); the back-edge carries no loop note, so no `.align` pad and no hoist (constants reload inside the loop, reusing the same reg). Verified on FindAILabel (game/ai): 68 -> 64 bytes, byte-exact."
confidence = "proven"
evidence = ["src/game/ai.c::FindAILabel", "config/pal103/status/game/ai.toml"]

[[quirk]]
id = "default.delay-slot-reorg-fill"
profiles = ["default"]
category = "codegen_shape"
signature = "a float-compare branch (`bc1f`/`bc1t`) whose delay slot retail leaves empty, loading the next FP constant AFTER it"
effect = "ee-gcc's reorg pass fills the branch delay slot with an anticipatable but dead-when-taken FP load (e.g. `lwc1 D_xxxx`); retail declined every such candidate and left the slot empty. The one extra instruction shifts the whole tail by a word, cascading the byte diff even when allocation and logic match."
handling = "NOT reliably source-controllable -- record a `no_progress` blocker and keep the C at state=asm (candidate for `equivalent`). Rejected experiments on DrawCredits: `&&` vs nested ifs, a loop-top temp, an inner temp, a product hoist -- none made reorg decline the fill."
confidence = "proven"
evidence = ["src/game/credits.c::DrawCredits", "config/pal103/status/game/credits.toml"]

[[quirk]]
id = "default.whole-fn-callee-save-regalloc"
profiles = ["default"]
category = "register_allocation"
signature = "a large function where both builds allocate the SAME callee-saved mask but assign different pseudos to specific $sN registers"
effect = "gcc-2.95 global allocation ties on priority for adjacent pseudos and ranks them differently from retail (e.g. MovePlayer: retail keeps `c` in $s4, the candidate in $s3 -- a `...83...`->`...63...` base-register swap across the whole function). Not a missing-variable problem; the mask matches, only the numbering differs, and it dominates the diff."
handling = "MATCHING HINT / frequent blocker: nudge allocation priority via the live-range/ref-count of the competing locals (an explicit temp, or reordering first-use) WITHOUT adding an addressing indirection -- an intermediate `obj` pointer collapsed MovePlayer to 1.35%. When it cannot be steered, record a `no_progress` blocker and keep at state=asm."
confidence = "proven"
evidence = ["src/game/creature.c::MovePlayer", "src/game/game_obj.c::PlayerCreatureCollisions", "src/game/ai.c::ResetAI"]

[[quirk]]
id = "default.soft-double-abi"
profiles = ["default", "sce"]
category = "codegen_shape"
signature = "any `double`-typed arithmetic or comparison in the C (the EE has no hardware doubles)"
effect = "retail does NOT use compiler soft-float; float->double math and comparisons go through explicit runtime helpers `fptodp(f32)->u64`, `dpcmp(u64,u64)->s32`, `dpsub`/`dpmul`/`dptofp` (u64 bit patterns). Plain `double` C makes gcc call its own soft-float (`__adddf3` etc.) and never matches."
handling = "MATCHING HINT: model doubles as `u64` bit patterns and call the explicit helpers (e.g. `d = fptodp(f); if (dpcmp(d, K) < 0) ...`). Verified on numath/nuplane and MovePlayer's deadzone/fabs compares."
confidence = "proven"
evidence = ["src/numath/nuplane.c", "src/game/creature.c::MovePlayer", "src/sdk/gcc/dp-bit.c"]

[[quirk]]
id = "default.early-return-cross-jump"
profiles = ["default"]
category = "codegen_shape"
signature = "a top-of-function guard that returns a value ALSO returned elsewhere in the function"
effect = "an early `if (cond) return X;` lets gcc cross-jump/merge that `return X` with a later identical `return X` into one block placed after the loop body -- an extra branch that shifts the whole tail."
handling = "MATCHING HINT: mirror the retail brace structure -- `if (!cond) { ...; return Y; } return X;` -- so the guard's return stays at the end and a mid-body early return uses a single `blez reg,<shared epilogue>` (value in the delay slot). Matched NewCharacterIdle in one iteration by switching to the wrapped form."
confidence = "proven"
evidence = ["src/game/creature.c::NewCharacterIdle"]

[[quirk]]
id = "default.varargs-eabi"
profiles = ["default"]
category = "codegen_shape"
signature = "a variadic (printf-like) function in a game/engine TU"
effect = "SN ee-gcc 2.95.2 has no usable <stdarg.h>; retail uses a local `va_list` with EABI `__builtin_va_start` plus an `__builtin_args_info(2)` correction for the register-save area. A modern stdarg spelling emits a different prologue."
handling = "MATCHING RECIPE: declare a local `va_list`, `__builtin_va_start` with the args_info(2) correction (see nucore/nuerror). Proven -- all 7 functions of nucore/nuerror matched."
confidence = "proven"
evidence = ["src/nucore/nuerror.c", "config/pal103/status/nucore/nuerror.toml"]

[[quirk]]
id = "default.pal-float-literal-scaling"
profiles = ["default"]
category = "constants"
signature = "a per-frame rate/threshold constant ported from a 60Hz GameCube reference"
effect = "PAL v1.03 runs at 50Hz, so GC 60Hz constants are scaled x60/50 and the retail .lit4 slot holds a ROUND-TOWARD-ZERO float image (e.g. dt = 0.59999996f = 0x3F199999 for 0.6, NOT the nearest-even 0.6f). Using the GC value or a rounded literal yields a different .lit4 bit pattern and the mapper mismatches."
handling = "MATCHING HINT: write the EXACT decimal of the retail .lit4 image (round toward zero), not the mathematically clean value. Confirmed across MovePlayer's dt/friction/sink constants."
confidence = "proven"
evidence = ["src/game/creature.c::MovePlayer"]

[[quirk]]
id = "default.adjacent-global-store-order"
profiles = ["default", "sce"]
category = "codegen_shape"
signature = "two or more stores to adjacent global/struct fields emitted from consecutive C statements"
effect = "-O2 deterministically permutes adjacent global stores relative to source order: a pair is REVERSED, a triple ROTATES RIGHT. Source order != emission order, so a naive transcription mismatches the store sequence."
handling = "MATCHING HINT: pre-permute the C statement order to cancel it (pair -> write in reverse; triple -> rotate). Matched SpaceCortexFunction_TakeHit (mom.x/mom.z swap)."
confidence = "proven"
evidence = ["src/game/ai.c::SpaceCortexFunction_TakeHit", "src/game/game_obj.c"]

[[quirk]]
id = "default.gcse-reread-copy"
profiles = ["default", "sce"]
category = "codegen_shape"
signature = "a lone `daddu $x,$y,$0` register copy after a load, with no matching C-level assignment"
effect = "it is PRE/GCSE re-reading the same memory expression in a later basic block, not a C local copy. Introducing a C temp to 'explain' it adds a real store/reload and diverges."
handling = "MATCHING HINT: do NOT add a C variable for it -- re-read the SAME expression (same array element / field) in the second block and let GCSE materialize the copy."
confidence = "likely"
evidence = ["src/game/game_obj.c"]
