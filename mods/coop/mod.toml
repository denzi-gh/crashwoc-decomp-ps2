# Coop mod: publish the local player's state into the mailbox every frame,
# consume the bridge-written remote slot, and draw the remote player as a
# visual-only puppet whenever both sides are in the same level.
# Hooks DoInput like hello does, so coop and hello cannot be built together.

[mod]
name = "coop"
version = "0.4"
target = "pal103"

[code]
sources = ["mod.c"]

[[hook]]
function = "DoInput"
handler = "coop_tick"
mode = "pre"

[[hook]]
function = "DrawCreatures"
handler = "coop_draw_creatures"
mode = "replace"

# Stage 3a note: item sync needs NO capture hook -- the plr_items/powers
# words already carry WHAT was collected, and each reward bit maps to
# exactly one object character (PickupItem's dispatch), so the peer finds
# the live object by identity. (A pObj slot-index channel was removed
# 2026-07-12: slot order diverges between instances as objects stream in,
# which replayed the wrong object.)

# VS mode (bridge --vs): PickupItem hook is ATTRIBUTION only -- it marks
# which plr_items bits were claimed first-hand (vs the merge replay's
# g_coop_applying echo) so the crystal/carving can be tinted in the owner's
# player colour. Sync semantics are unchanged; outside VS it is a pure
# pass-through.
[[hook]]
function = "PickupItem"
handler = "coop_pickup_item"
mode = "replace"

# The name/Paused label is 2D text (Text3D). Text3D only queues glyphs into
# font3d_scene, which DrawPanel submits with NuRndrGScnObj under the panel
# camera it sets up mid-function. DrawMenu is called every frame from inside
# DrawPanel *after* that camera is set and *before* later submit batches, so
# appending our text right after DrawMenu gets it rendered in the right context.
[[hook]]
function = "DrawMenu"
handler = "coop_draw_menu"
mode = "replace"

# Stage 3b (per-crate sync): capture crate deaths at CrateOff -- the one
# point every crate goes through (stack/TNT/nitro-switch chains bypass
# BreakCrate); hook GotoCheckpoint to reconcile the bitmaps after a death
# respawn. Checkpoints are SHARED: replaying a remote checkpoint-crate
# break runs CrateOff's own ResetCheckpoint (args come from the crate), so
# both players get the same respawn point -- no hook needed for that.
[[hook]]
function = "CrateOff"
handler = "coop_crate_off"
mode = "replace"

[[hook]]
function = "GotoCheckpoint"
handler = "coop_goto_checkpoint"
mode = "replace"

# Stage 4 (shared Fire Boss): replace the inner boss brain and the balloon
# damage site. With no --host on either side both handlers fall through to
# orig (bit-identical retail). The host runs orig and publishes the boss
# state; the client skips orig, mirrors the state as a puppet, and reports
# balloon hits back as a monotonic counter.
[[hook]]
function = "ProcessFireBoss"
handler = "coop_fire_boss"
mode = "replace"

[[hook]]
function = "ProcessJeepBalloon"
handler = "coop_jeep_balloon"
mode = "replace"

# 0x20 SDK header + 0x2D8 CoopMailbox (v11) + VTNT dev channel at
# payload+0x3D0 all fit in 0x400.
[mailbox]
size = 0x400
