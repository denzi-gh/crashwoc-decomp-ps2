# Coop mod: publish the local player's state into the mailbox every frame,
# consume the bridge-written remote slot, and draw the remote player as a
# visual-only puppet whenever both sides are in the same level.
# Hooks DoInput like hello does, so coop and hello cannot be built together.

[mod]
name = "coop"
version = "0.2"
target = "pal103"

[code]
sources = ["mod.c"]

[[hook]]
function = "DoInput"
handler = "coop_tick"
mode = "pre"

[[hook]]
function = "DrawCreatures"
handler = "coop_draw_creatures"
mode = "replace"

# The name/Paused label is 2D text (Text3D). Text3D only queues glyphs into
# font3d_scene, which DrawPanel submits with NuRndrGScnObj under the panel
# camera it sets up mid-function. DrawMenu is called every frame from inside
# DrawPanel *after* that camera is set and *before* later submit batches, so
# appending our text right after DrawMenu gets it rendered in the right context.
[[hook]]
function = "DrawMenu"
handler = "coop_draw_menu"
mode = "replace"

[mailbox]
size = 0x200
